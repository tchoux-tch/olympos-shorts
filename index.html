<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>영어 지문 쇼츠 카드리더</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #111827;
            color: #ffffff;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* 쇼츠 실제 비율 프레임 (1080 x 1920) */
        .shorts-container {
            width: 405px;  /* 화면 표시용 축소 비율 (원래: 1080px) */
            height: 720px; /* 화면 표시용 축소 비율 (원래: 1920px) */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 24px;
            padding: 36px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            position: relative;
        }

        /* 상단 태그 */
        .tag {
            align-self: flex-start;
            background: #38bdf8;
            color: #0f172a;
            font-size: 13px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 본문 (영어 지문) */
        .passage {
            font-size: 20px;
            line-height: 1.6;
            font-weight: 600;
            color: #f8fafc;
            margin-top: 20px;
            word-break: keep-all;
        }

        /* 지문 내 핵심 구문 하이라이트 스타일 */
        .highlight {
            color: #facc15;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* 하단 (해석 및 어휘) */
        .bottom-section {
            border-top: 1px solid #334155;
            padding-top: 20px;
        }

        .translation {
            font-size: 15px;
            line-height: 1.5;
            color: #94a3b8;
            margin-bottom: 16px;
            word-break: keep-all;
        }

        .vocab-box {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: #cbd5e1;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .vocab-item {
            background: #334155;
            padding: 4px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- 쇼츠 카드 프레임 -->
    <div class="shorts-container">
        <div>
            <div class="tag">Today's English</div>
            <!-- 영어 지문 -->
            <div class="passage">
                Small daily improvements over time lead to <span class="highlight">stunning results</span>. Consistency is the key to mastering any new skill.
            </div>
        </div>

        <div class="bottom-section">
            <!-- 한글 해석 -->
            <div class="translation">
                시간이 지남에 따라 쌓이는 작은 일상의 발전은 놀라운 결과를 만들어냅니다. 꾸준함이 새로운 기술을 습득하는 핵심입니다.
            </div>
            <!-- 주요 단어 -->
            <div class="vocab-box">
                <span class="vocab-item">stunning: 놀라운</span>
                <span class="vocab-item">consistency: 꾸준함</span>
            </div>
        </div>
    </div>

</body>
</html>
